<head>
    <!DOCTYPE html>
<html lang="ar">
<head>

</html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الذاكرة - TseYFZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* أنماط لعبة الذاكرة - متوافقة مع موقعك */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 136, 0.3);
        }

        .game-header h1 {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .game-header p {
            color: #aaa;
            font-size: 1.2rem;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-radius: 10px;
            min-width: 120px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4fc3f7;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        .controls {
            margin: 20px 0;
        }

        .btn {
            background: linear-gradient(to right, #00ff88, #00cc6a);
            color: black;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px 10px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }

        .btn-restart {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
        }

        .difficulty {
            margin: 15px 0;
        }

        .difficulty button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .difficulty button.active {
            background: #00ff88;
            color: black;
            border-color: #00ff88;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 0 auto;
            max-width: 600px;
            perspective: 1000px;
        }

        .card {
            height: 100px;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }

        .card-front {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            transform: rotateY(180deg);
            color: white;
        }

        .card-back {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
        }

        .card.matched .card-front {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            animation: pulse 0.5s;
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 100;
            border: 2px solid #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
            min-width: 300px;
        }

        .message h2 {
            color: #00ff88;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .message p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .message.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            
            .card {
                height: 80px;
            }
            
            .game-header h1 {
                font-size: 2rem;
            }
            
            .stats-container {
                gap: 10px;
            }
            
            .stat-box {
                min-width: 100px;
                padding: 10px 15px;
            }
        }

        @media (max-width: 480px) {
            .game-board {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .card {
                height: 70px;
            }
            
            .btn {
                padding: 10px 15px;
                margin: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🧠 لعبة الذاكرة</h1>
            <p>اختبر ذاكرتك وطابق البطاقات بأقل عدد من الحركات!</p>
            
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-value" id="moves">0</div>
                    <div class="stat-label">الحركات</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="timer">0</div>
                    <div class="stat-label">الثواني</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="matches">0</div>
                    <div class="stat-label">المطابقات</div>
                </div>
            </div>

            <div class="difficulty">
                <button onclick="setDifficulty(4)" class="active">سهل (4x4)</button>
                <button onclick="setDifficulty(6)">متوسط (6x6)</button>
                <button onclick="setDifficulty(8)">صعب (8x8)</button>
            </div>

            <div class="controls">
                <button class="btn" onclick="startGame()">
                    <i class="fas fa-play"></i> بدء اللعبة
                </button>
                <button class="btn btn-restart" onclick="restartGame()">
                    <i class="fas fa-redo"></i> إعادة
                </button>
            </div>
        </div>

        <main>
            <div class="game-board" id="gameBoard">
                <!-- البطاقات سيتم إنشاؤها بالجافاسكريبت -->
            </div>
        </main>

        <div class="controls">
            <button class="back-btn" onclick="window.parent.closeGameWindow ? window.parent.closeGameWindow() : window.history.back()">
                <i class="fas fa-arrow-right"></i> العودة للصفحة الرئيسية
            </button>
        </div>
    </div>

    <div class="message" id="winMessage">
        <h2>🎉 فوز رائع!</h2>
        <p>أنهيت اللعبة في <span id="finalTime">0</span> ثانية</p>
        <p>بـ <span id="finalMoves">0</span> حركة</p>
        <button class="btn" onclick="restartGame()">
            <i class="fas fa-redo"></i> اللعب مرة أخرى
        </button>
    </div>

    <script>
        // العناصر الرئيسية
        const gameBoard = document.getElementById('gameBoard');
        const movesElement = document.getElementById('moves');
        const timerElement = document.getElementById('timer');
        const matchesElement = document.getElementById('matches');
        const winMessage = document.getElementById('winMessage');
        const finalTimeElement = document.getElementById('finalTime');
        const finalMovesElement = document.getElementById('finalMoves');

        // متغيرات اللعبة
        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matches = 0;
        let timer = 0;
        let timerInterval;
        let gameStarted = false;
        let totalPairs = 8;
        let boardSize = 4;

        // الرموز للبطاقات
        const symbols = ['🍎', '🍌', '🍒', '🍕', '⚽', '🎮', '🎸', '🚗', 
                        '✈️', '⭐', '❤️', '🐱', '🐶', '🦁', '🐼', '🐯'];

        // إنشاء البطاقات
        function createCards() {
            gameBoard.innerHTML = '';
            cards = [];
            
            // إنشاء مجموعة الرموز
            const selectedSymbols = symbols.slice(0, totalPairs);
            const cardSymbols = [...selectedSymbols, ...selectedSymbols];
            
            // خلط الرموز
            shuffleArray(cardSymbols);
            
            // تحديث تخطيط الشبكة
            gameBoard.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
            
            // إنشاء البطاقات
            cardSymbols.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.symbol = symbol;
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="card-front">${symbol}</div>
                    <div class="card-back">?</div>
                `;
                
                card.addEventListener('click', () => flipCard(card));
                gameBoard.appendChild(card);
                cards.push(card);
            });
            
            // إعادة تعليمات المحاولات
            resetGameStats();
        }

        // خلط البطاقات
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // قلب البطاقة
        function flipCard(card) {
            if (!gameStarted) {
                startTimer();
                gameStarted = true;
            }
            
            if (card.classList.contains('flipped') || 
                card.classList.contains('matched') || 
                flippedCards.length >= 2) {
                return;
            }
            
            card.classList.add('flipped');
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                moves++;
                movesElement.textContent = moves;
                
                setTimeout(checkForMatch, 500);
            }
        }

        // التحقق من المطابقة
        function checkForMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.symbol === card2.dataset.symbol) {
                // تطابق
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                matchesElement.textContent = matches;
                
                // فوز؟
                if (matches === totalPairs) {
                    endGame();
                }
            } else {
                // لا يوجد تطابق
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
            }
            
            flippedCards = [];
        }

        // بدء المؤقت
        function startTimer() {
            timer = 0;
            timerElement.textContent = timer;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer++;
                timerElement.textContent = timer;
            }, 1000);
        }

        // نهاية اللعبة
        function endGame() {
            clearInterval(timerInterval);
            
            finalTimeElement.textContent = timer;
            finalMovesElement.textContent = moves;
            
            setTimeout(() => {
                winMessage.classList.add('active');
            }, 500);
        }

        // إعادة تعليمات المحاولات
        function resetGameStats() {
            moves = 0;
            matches = 0;
            gameStarted = false;
            
            movesElement.textContent = moves;
            matchesElement.textContent = matches;
            timerElement.textContent = timer;
            
            clearInterval(timerInterval);
            winMessage.classList.remove('active');
        }

        // إعادة بدء اللعبة
        function restartGame() {
            resetGameStats();
            createCards();
        }

        // بدء لعبة جديدة
        function startGame() {
            resetGameStats();
            createCards();
            startTimer();
            gameStarted = true;
        }

        // تعيين الصعوبة
        function setDifficulty(size) {
            boardSize = size;
            
            // تحديث الأزرار النشطة
            document.querySelectorAll('.difficulty button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // حساب عدد الأزواج
            if (size === 4) {
                totalPairs = 8;
            } else if (size === 6) {
                totalPairs = 18;
            } else if (size === 8) {
                totalPairs = 32;
            }
            
            restartGame();
        }

        // بدء اللعبة عند تحميل الصفحة
        window.onload = function() {
            createCards();
        };
    </script>
</body>

</html>
